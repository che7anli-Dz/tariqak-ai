<html lang="ar" dir="rtl">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طريقك — نبنيو معاك طريق</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --green:#059669;
    --green-dark:#047857;
    --green-light:#d1fae5;
    --amber:#f59e0b;
    --dark:#0f172a;
    --dark2:#1e293b;
    --text:#172033;
    --muted:#64748b;
    --bg:#f8fafc;
    --white:#fff;
    --border:#e2e8f0;
    --danger:#ef4444;
}

body{
    font-family:"Cairo",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.8;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
    border:none;
}

a{
    text-decoration:none;
    color:inherit;
}

/* NAVBAR */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(15,23,42,.96);
    backdrop-filter:blur(15px);
    color:white;
    padding:12px 18px;
}

.nav-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    font-size:22px;
}

.logo-icon{
    width:40px;
    height:40px;
    background:linear-gradient(135deg,var(--green),#10b981);
    border-radius:13px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.nav-links{
    display:flex;
    gap:8px;
}

.nav-links button{
    background:transparent;
    color:#cbd5e1;
    padding:8px 12px;
    border-radius:10px;
    transition:.2s;
}

.nav-links button:hover{
    background:#334155;
    color:white;
}

.mobile-menu{
    display:none;
}

/* GENERAL */

.container{
    width:min(1150px,92%);
    margin:auto;
}

.page{
    min-height:calc(100vh - 65px);
}

.section{
    padding:75px 0;
}

.section-title{
    font-size:30px;
    font-weight:800;
    margin-bottom:12px;
}

.section-subtitle{
    color:var(--muted);
    margin-bottom:35px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--green-light);
    color:var(--green-dark);
    padding:6px 13px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
}

.btn{
    padding:13px 20px;
    border-radius:13px;
    font-weight:700;
    transition:.2s;
    display:inline-flex;
    justify-content:center;
    align-items:center;
    gap:8px;
}

.btn-primary{
    background:var(--green);
    color:white;
}

.btn-primary:hover{
    background:var(--green-dark);
    transform:translateY(-2px);
}

.btn-secondary{
    background:white;
    color:var(--text);
    border:1px solid var(--border);
}

.btn-secondary:hover{
    background:#f1f5f9;
}

.btn-amber{
    background:var(--amber);
    color:#111827;
}

.btn-danger{
    background:#fee2e2;
    color:#b91c1c;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:22px;
    padding:24px;
    box-shadow:0 10px 30px rgba(15,23,42,.05);
}

.hidden{
    display:none!important;
}

/* HERO */

.hero{
    min-height:680px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 30%,rgba(16,185,129,.25),transparent 30%),
        radial-gradient(circle at 85% 20%,rgba(245,158,11,.15),transparent 25%),
        var(--dark);
    color:white;
}

.hero-content{
    max-width:800px;
    padding:80px 0;
}

.hero h1{
    font-size:clamp(35px,6vw,64px);
    line-height:1.25;
    margin:20px 0;
    font-weight:800;
}

.hero h1 span{
    color:#34d399;
}

.hero p{
    color:#cbd5e1;
    font-size:18px;
    max-width:680px;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:30px;
}

.hero .btn-secondary{
    background:rgba(255,255,255,.08);
    color:white;
    border-color:rgba(255,255,255,.15);
}

/* JOURNEY */

.journey{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
    align-items:center;
}

.journey-item{
    text-align:center;
}

.journey-icon{
    width:60px;
    height:60px;
    border-radius:18px;
    background:white;
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    margin:auto auto 8px;
}

.journey-arrow{
    color:var(--green);
    text-align:center;
    font-size:22px;
}

/* FEATURES */

.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.feature-icon{
    font-size:30px;
    margin-bottom:12px;
}

.feature h3{
    margin-bottom:7px;
}

.feature p{
    color:var(--muted);
    font-size:14px;
}

/* HONEST */

.honest{
    background:var(--dark);
    color:white;
}

.honest-box{
    max-width:800px;
    margin:auto;
    text-align:center;
}

.honest-box p{
    color:#cbd5e1;
}

/* QUIZ */

.quiz-wrap{
    max-width:800px;
    margin:50px auto;
}

.progress{
    height:10px;
    background:#e2e8f0;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0 30px;
}

.progress-bar{
    height:100%;
    background:linear-gradient(90deg,var(--green),#34d399);
    transition:.4s;
}

.question{
    margin-bottom:25px;
}

.question label{
    display:block;
    font-weight:700;
    margin-bottom:10px;
}

.input,
.select{
    width:100%;
    padding:13px 15px;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    background:white;
}

.input:focus,
.select:focus{
    border-color:var(--green);
}

.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.option{
    padding:14px;
    border:1px solid var(--border);
    background:white;
    border-radius:14px;
    cursor:pointer;
    transition:.2s;
    text-align:center;
}

.option:hover{
    border-color:var(--green);
}

.option.selected{
    background:var(--green-light);
    border-color:var(--green);
    color:var(--green-dark);
    font-weight:700;
}

.chips{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.chip{
    border:1px solid var(--border);
    background:white;
    padding:9px 14px;
    border-radius:999px;
    cursor:pointer;
}

.chip.selected{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

.quiz-actions{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
}

/* TRACKS */

.tracks{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.track-card{
    position:relative;
}

.track-level{
    font-size:12px;
    font-weight:800;
    display:inline-block;
    padding:5px 10px;
    border-radius:999px;
    margin-bottom:12px;
}

.level-green{
    background:#dcfce7;
    color:#166534;
}

.level-yellow{
    background:#fef3c7;
    color:#92400e;
}

.level-blue{
    background:#dbeafe;
    color:#1d4ed8;
}

.track-icon{
    font-size:42px;
    margin-bottom:10px;
}

.track-card h3{
    font-size:20px;
}

.track-card p{
    color:var(--muted);
    font-size:14px;
}

.track-meta{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:15px 0;
}

.meta{
    background:#f1f5f9;
    padding:5px 9px;
    border-radius:8px;
    font-size:12px;
}

/* DASHBOARD */

.dashboard-grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.progress-big{
    height:15px;
    background:#e2e8f0;
    border-radius:20px;
    overflow:hidden;
    margin:12px 0;
}

.progress-big div{
    height:100%;
    background:var(--green);
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:20px 0;
}

.stat{
    text-align:center;
}

.stat strong{
    font-size:27px;
    display:block;
    color:var(--green-dark);
}

.stat span{
    color:var(--muted);
    font-size:13px;
}

.task{
    display:flex;
    gap:15px;
    align-items:flex-start;
}

.task-check{
    width:35px;
    height:35px;
    background:var(--green-light);
    color:var(--green-dark);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CHAT */

.chat{
    max-width:850px;
    margin:40px auto;
}

.chat-box{
    height:480px;
    overflow-y:auto;
    background:#f1f5f9;
    padding:20px;
    border-radius:20px;
}

.message{
    max-width:80%;
    padding:13px 16px;
    border-radius:17px;
    margin-bottom:12px;
}

.message.bot{
    background:white;
    border:1px solid var(--border);
    margin-left:auto;
}

.message.user{
    background:var(--green);
    color:white;
    margin-right:auto;
}

.chat-input{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.chat-input input{
    flex:1;
}

/* TASKS */

.task-list{
    display:grid;
    gap:12px;
}

.task-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.task-row input{
    width:20px;
    height:20px;
    accent-color:var(--green);
}

.task-row.done h3{
    text-decoration:line-through;
    color:var(--muted);
}

/* PORTFOLIO */

.portfolio-header{
    background:linear-gradient(135deg,var(--dark),#064e3b);
    color:white;
    border-radius:25px;
    padding:35px;
}

.project-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:20px;
}

.project{
    border:1px solid var(--border);
    border-radius:17px;
    padding:18px;
}

/* PROFILE */

.profile-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.badge-achievement{
    background:#fffbeb;
    border:1px solid #fde68a;
    padding:10px 13px;
    border-radius:12px;
}

/* MOBILE */

@media(max-width:850px){

    .nav-links{
        display:none;
    }

    .mobile-menu{
        display:block;
        background:#334155;
        color:white;
        padding:8px 12px;
        border-radius:10px;
    }

    .journey{
        grid-template-columns:1fr;
        gap:12px;
    }

    .journey-arrow{
        transform:rotate(90deg);
    }

    .features,
    .tracks,
    .project-grid{
        grid-template-columns:1fr;
    }

    .dashboard-grid,
    .profile-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .options{
        grid-template-columns:1fr;
    }

    .hero{
        min-height:600px;
    }

    .hero-buttons{
        flex-direction:column;
    }

    .hero-buttons .btn{
        width:100%;
    }

    .chat-box{
        height:430px;
    }
}
</style>
</head>

function progress(){
    return Math.round((state.completedTasks.length/TASKS.length)*100);
}

function level(){
    const p=progress();
    if(p<15)return 0;
    if(p<30)return 1;
    if(p<50)return 2;
    if(p<70)return 3;
    if(p<90)return 4;
    return 5;
}

function escapeHTML(str){
    return String(str||"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =========================
   QUIZ FUNCTIONS
========================= */

function choose(key,value){
    state.quiz[key]=value;
    save();
    render();
}

function toggleInterest(value){

if(!state.quiz.interests)
    state.quiz.interests=[];

if(state.quiz.interests.includes(value)){
    state.quiz.interests=
    state.quiz.interests.filter(x=>x!==value);
}else{
    state.quiz.interests.push(value);
}

save();
render();
}

function nextQuiz(){

if(state.quizStep===1){

const age=document.getElementById("age")?.value;
const wilaya=document.getElementById("wilaya")?.value;

if(age)state.quiz.age=age;
if(wilaya)state.quiz.wilaya=wilaya;
}

state.quizStep++;
save();
render();
}

function prevQuiz(){
    state.quizStep--;
    save();
    render();
}

function finishQuiz(){

state.quizStep=1;
save();
go("result");
}

/* =========================
   SCORING
========================= */

function scoreTracks(){

let scores=TRACKS.map(t=>({
    track:t,
    score:0
}));

const q=state.quiz;

scores.forEach(item=>{

const t=item.track;

if(q.interests){
    q.interests.forEach(i=>{
        if(t.interests.includes(i))
            item.score+=5;
    });
}

if(q.goal && t.goals.includes(q.goal))
    item.score+=4;

if(q.device==="هاتف فقط"){
    if(["video","design","social","writing","content","photo"].includes(t.id))
        item.score+=3;
}

if(q.money==="0 دج"){
    if(["video","design","social","writing","content"].includes(t.id))
        item.score+=2;
}

if(q.place==="من المنزل"){
    if(["video","design","coding","social","writing","photo","content"].includes(t.id))
        item.score+=2;
}

if(q.type==="عملي"){
    if(["repair","craft","food"].includes(t.id))
        item.score+=4;
}

if(q.people==="مع الناس"){
    if(["social","resell","ecommerce","food"].includes(t.id))
        item.score+=2;
}

});

scores.sort((a,b)=>b.score-a.score);

return scores.slice(0,3);
}

function nextTask(){

||TASKS[TASKS.length-1];

/* =========================
   TASKS
========================= */

function tasks(){

const l=level();

return `
<div class="page">
<div class="container section">

<span class="badge">🎓 التربص</span>

<h1 class="section-title" style="margin-top:15px">
مهامك
</h1>

<p class="section-subtitle">
ما تتعلمش غير بالنظر. طبق.
</p>

<div class="card" style="margin-bottom:20px">

<strong>المستوى الحالي: ${l}/5</strong>

<div class="progress-big">
<div style="width:${progress()}%"></div>
</div>

${progress()}% من الخطة مكتملة

</div>

<div class="task-list">

${TASKS.map(t=>{

const done=state.completedTasks.includes(t.id);
const locked=t.level>l+1;

return `
<div class="card task-row ${done?"done":""}">

<input type="checkbox"
${done?"checked":""}
${locked?"disabled":""}
onchange="toggleTask(${t.id})">

<div style="flex:1">

<h3>${t.title}</h3>

<p style="color:#64748b">${t.desc}</p>

<small>
⏱ ${t.time}
&nbsp; • &nbsp;
المستوى ${t.level}
</small>

</div>

${locked?`<span>🔒</span>`:""}

</div>
`;

}).join("")}

</div>

</div>
</div>
`;
}

function toggleTask(id){

if(state.completedTasks.includes(id)){
    state.completedTasks=
    state.completedTasks.filter(x=>x!==id);
}else{
    state.completedTasks.push(id);
}

save();
render();
}

/* =========================

========================= */

function mentor(){

if(!state.mentorMessages.length){

state.mentorMessages=[{
role:"bot",
text:`أهلاً بك 👋

أنا المرافق تاعك في طريقك.

نقدر نشرحلك، نعطيك تمارين، نراجع خدمتك، ونبقى فاهم المسار والتقدم تاعك.

ما نعطيكش كلام عام وخلاص. الهدف هو نعرف وضعك ونعاونك في الخطوة اللي بعدها.

قولّي واش حاب نديرو اليوم؟`
}];

save();
}

return `
<div class="page">

<div class="chat">

<span class="badge">🤖 AI المرافق</span>

</p>

</select>

</div>

<div class="chat-box" id="chatBox">

${state.mentorMessages.map(m=>`
<div class="message ${m.role==="bot" || m.role==="assistant" ? "bot":"user"}">
${formatMentorText(m.text)}
</div>
`).join("")}

${state.mentorLoading?`
<div class="message bot">

</div>
`:""}

</div>

<div class="chat-input">

<input class="input"
id="mentorInput"
autocomplete="off"
placeholder="اكتب واش حاب تقول للمرافق..."
onkeydown="if(event.key==='Enter'){event.preventDefault();sendMentor()}">

<button class="btn btn-primary"
id="mentorSendBtn"
onclick="sendMentor()"
${state.mentorLoading?"disabled":""}>
${state.mentorLoading?"⏳":"إرسال"}
</button>

</div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap">

<small style="color:#64748b">
🟢 المرافق مربوط بالذكاء الاصطناعي
</small>

<button class="btn btn-secondary"
style="padding:8px 12px"
onclick="clearMentorChat()">
مسح المحادثة
</button>

</div>

</div>

</div>
</div>
`;
}

function formatMentorText(text){

return escapeHTML(text||"")
.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")
.replace(/\n/g,"<br>");
}

function getMentorContext(){

const track=getTrack();
const task=nextTask();

return {

name:state.name || "صديق طريقك",

age:state.quiz?.age || "",
wilaya:state.quiz?.wilaya || "",
study:state.quiz?.study || "",
work:state.quiz?.work || "",
hours:state.quiz?.hours || "",
device:state.quiz?.device || "",
internet:state.quiz?.internet || "",
money:state.quiz?.money || "",
mobility:state.quiz?.mobility || "",

interests:state.quiz?.interests || [],

people:state.quiz?.people || "",
place:state.quiz?.place || "",
type:state.quiz?.type || "",
commit:state.quiz?.commit || "",
goal:state.quiz?.goal || "",

selectedTrack:state.selectedTrack || "",
trackName:track?.name || "",
trackDescription:track?.description || "",
trackTools:track?.tools || "",

progress:progress(),
level:level(),

completedTasks:state.completedTasks || [],

currentTask:task ? {
id:task.id,
title:task.title,
description:task.desc,
time:task.time,
level:task.level
} : null,

mentorStyle:state.mentorStyle || "dz"

};

}

async function sendMentor(){

const input=document.getElementById("mentorInput");

if(!input || !input.value.trim())return;

if(state.mentorLoading)return;

const text=input.value.trim();

if(text.length>4000){

alert("الرسالة طويلة بزاف. حاول تختصرها شوية.");

return;
}

/*
نأخذ التاريخ قبل إضافة الرسالة الحالية
حتى لا تتكرر الرسالة عند السيرفر.
*/

const history=state.mentorMessages
.slice(-16)
.map(m=>({
role:m.role==="bot" || m.role==="assistant"?"bot":"user",
text:String(m.text||"")
}));

state.mentorMessages.push({
role:"user",
text:text
});

state.mentorLoading=true;

save();
render();

setTimeout(()=>{

const box=document.getElementById("chatBox");

if(box)box.scrollTop=box.scrollHeight;

},50);

try{

const response=await fetch("/api/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:text,

history:history,

context:getMentorContext()

})

});

let data=null;

try{
data=await response.json();
}catch(e){
data=null;
}

if(!response.ok || !data || !data.success){

throw new Error(
data?.error ||
"تعذر الاتصال بالمرافق."
);

}

state.mentorMessages.push({

role:"bot",

text:data.answer || "ما قدرتش نجاوبك حالياً."

});

}catch(error){

console.error("Mentor error:",error);

state.mentorMessages.push({

role:"bot",

text:`ما قدرتش نتصل بالمرافق حالياً.

تأكد بلي الـBackend راه خدام، ومن بعد عاود جرب.

إذا راك تشغل الموقع من السيرفر، افتح الموقع من نفس الرابط تاع السيرفر وما تفتحش index.html مباشرة.`

});

}finally{

state.mentorLoading=false;

save();

render();

setTimeout(()=>{

const box=document.getElementById("chatBox");

if(box)box.scrollTop=box.scrollHeight;

},50);

}

}

function clearMentorChat(){

if(!confirm("متأكد بلي حاب تمسح كامل محادثة المرافق؟"))return;

state.mentorMessages=[{

role:"bot",

text:`رجعنا من البداية 👋

أنا المرافق تاعك.

قولّي واش حاب نعاونك فيه اليوم؟`

}];

save();

render();

}
